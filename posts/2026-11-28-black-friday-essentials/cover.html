<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1000"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=1080,H=1000;
let seed=1128;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
function rr(px,py,w,h,rad){x.beginPath();x.moveTo(px+rad,py);x.arcTo(px+w,py,px+w,py+h,rad);x.arcTo(px+w,py+h,px,py+h,rad);x.arcTo(px,py+h,px,py,rad);x.arcTo(px,py,px+w,py,rad);x.closePath()}
const VX=540,VY=330; // vanishing point
// background: dark store
x.fillStyle='#06080a';x.fillRect(0,0,W,H);
// far wall glow
let fw=x.createRadialGradient(VX,VY,10,VX,VY,420);fw.addColorStop(0,'rgba(120,255,140,.35)');fw.addColorStop(.4,'rgba(34,209,30,.12)');fw.addColorStop(1,'rgba(0,0,0,0)');
x.fillStyle=fw;x.fillRect(0,0,W,H);
// ceiling
let cg=x.createLinearGradient(0,0,0,VY);cg.addColorStop(0,'#0b0e10');cg.addColorStop(1,'#141a17');
x.fillStyle=cg;x.beginPath();x.moveTo(0,0);x.lineTo(W,0);x.lineTo(VX+70,VY-60);x.lineTo(VX-70,VY-60);x.closePath();x.fill();
// ceiling light strips in perspective
for(let i=0;i<9;i++){const t=Math.pow(i/9,1.7);const y=VY-60-(VY-60)*(1-t)*1.0;const hw=70+(540-70)*(1-t);
  const yy=(VY-60)*(t);const w2=70+470*(1-t);
  x.fillStyle=`rgba(225,255,230,${.25+.6*(1-t)})`;x.shadowColor='rgba(150,255,160,.9)';x.shadowBlur=30*(1-t)+6;
  const th=Math.max(2,18*(1-t));x.fillRect(VX-w2*.35,yy+ (1-t)*0,w2*.7,th);}
x.shadowBlur=0;
// floor
let fg=x.createLinearGradient(0,VY+60,0,H);fg.addColorStop(0,'#1a211d');fg.addColorStop(1,'#050606');
x.fillStyle=fg;x.beginPath();x.moveTo(VX-70,VY+60);x.lineTo(VX+70,VY+60);x.lineTo(W,H);x.lineTo(0,H);x.closePath();x.fill();
// floor reflection streak
let rs=x.createLinearGradient(0,VY+60,0,H);rs.addColorStop(0,'rgba(160,255,170,.35)');rs.addColorStop(1,'rgba(0,0,0,0)');
x.fillStyle=rs;x.beginPath();x.moveTo(VX-20,VY+60);x.lineTo(VX+20,VY+60);x.lineTo(VX+220,H);x.lineTo(VX-220,H);x.closePath();x.fill();
// floor tiles lines
x.strokeStyle='rgba(255,255,255,.05)';x.lineWidth=1;
for(let i=-10;i<=10;i++){x.beginPath();x.moveTo(VX+i*7,VY+60);x.lineTo(VX+i*160,H);x.stroke()}
for(let k=1;k<14;k++){const t=Math.pow(k/14,2);const y=VY+60+(H-VY-60)*t;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
// shelves on both sides
const prodCols=['#e9efe9','#9fd8ff','#22D11E','#f2c14e','#ff7a6b','#c7b8ff','#7fe0c8','#ffffff'];
function shelfSide(side){
  const edgeX = side<0?0:W, innerX = side<0?VX-70:VX+70;
  // shelf body
  x.fillStyle='#0d1210';x.beginPath();x.moveTo(edgeX,0);x.lineTo(innerX,VY-60);x.lineTo(innerX,VY+60);x.lineTo(edgeX,H);x.closePath();x.fill();
  // rows of shelves
  const levels=6;
  for(let L=0;L<levels;L++){
    const a=L/levels,b=(L+1)/levels;
    // segments along depth
    const segs=26;
    for(let s=0;s<segs;s++){
      const t0=Math.pow(s/segs,1.6),t1=Math.pow((s+1)/segs,1.6);
      const X0=edgeX+(innerX-edgeX)*t0,X1=edgeX+(innerX-edgeX)*t1;
      const top0=0+(VY-60)*t0, bot0=H+(VY+60-H)*t0, top1=(VY-60)*t1, bot1=H+(VY+60-H)*t1;
      const ya0=top0+(bot0-top0)*a, yb0=top0+(bot0-top0)*b, ya1=top1+(bot1-top1)*a, yb1=top1+(bot1-top1)*b;
      // products: boxes/bottles
      const depthFade=1-t0*.85;
      const n=2;
      for(let p=0;p<n;p++){
        const f0=p/n+.06,f1=(p+1)/n-.06;
        const px0=X0+(X1-X0)*f0,px1=X0+(X1-X0)*f1;
        const hgt=(.45+r()*.4);
        const yBot0=yb0-(yb0-ya0)*.1,yBot1=yb1-(yb1-ya1)*.1;
        const yTop0=yBot0-(yb0-ya0)*hgt*.8,yTop1=yBot1-(yb1-ya1)*hgt*.8;
        const col=prodCols[Math.floor(r()*prodCols.length)];
        x.globalAlpha=.22+.6*depthFade;
        const g=x.createLinearGradient(px0,0,px1,0);g.addColorStop(0,col);g.addColorStop(1,'#1b221e');
        x.fillStyle=g;
        x.beginPath();x.moveTo(px0,yBot0);x.lineTo(px1,yBot0+(yBot1-yBot0)*f1);x.lineTo(px1,yTop0+(yTop1-yTop0)*f1);x.lineTo(px0,yTop0);x.closePath();x.fill();
        // label band
        x.fillStyle='rgba(255,255,255,.35)';
        const lb=(yBot0-yTop0)*.35;x.fillRect(Math.min(px0,px1),yTop0+lb,Math.abs(px1-px0),Math.max(1,lb*.25));
      }
      x.globalAlpha=1;
      // shelf edge line (lit)
      x.strokeStyle=`rgba(180,255,190,${.15+.35*depthFade})`;x.lineWidth=Math.max(1,6*(1-t0));
      x.beginPath();x.moveTo(X0,yb0);x.lineTo(X1,yb1);x.stroke();
    }
  }
  // shade near edge
  let sh=x.createLinearGradient(edgeX,0,innerX,0);sh.addColorStop(0,'rgba(0,0,0,.75)');sh.addColorStop(.35,'rgba(0,0,0,.2)');sh.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=sh;x.beginPath();x.moveTo(edgeX,0);x.lineTo(innerX,VY-60);x.lineTo(innerX,VY+60);x.lineTo(edgeX,H);x.closePath();x.fill();
}
shelfSide(-1);shelfSide(1);
// hanging aisle sign
x.save();x.strokeStyle='rgba(255,255,255,.3)';x.lineWidth=2;x.beginPath();x.moveTo(470,0);x.lineTo(470,112);x.moveTo(610,0);x.lineTo(610,112);x.stroke();
x.shadowColor='rgba(34,209,30,.9)';x.shadowBlur=40;rr(370,110,340,96,14);x.fillStyle='#0a110b';x.fill();x.lineWidth=4;x.strokeStyle='#22D11E';x.stroke();x.shadowBlur=0;
x.fillStyle='#eaffea';x.font='bold 52px Arial Black, Arial, sans-serif';x.textAlign='center';x.textBaseline='middle';
x.shadowColor='rgba(120,255,130,.9)';x.shadowBlur=18;x.fillText('ESSENTIALS',540,160);x.restore();

// shopping cart (front, center)
function cart(cx,cy,s){
  x.save();x.translate(cx,cy);x.scale(s,s);
  // floor glow under cart
  let gl=x.createRadialGradient(0,250,10,0,250,300);gl.addColorStop(0,'rgba(34,209,30,.45)');gl.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gl;x.fillRect(-320,120,640,260);
  // items piled in basket (behind front wire)
  const items=[
    [-170,-70,80,150,'#e9efe9',8],[-95,-110,70,190,'#9fd8ff',30],[-25,-60,95,140,'#f2c14e',6],[70,-95,70,175,'#22D11E',28],[140,-50,80,130,'#ff7a6b',8],
    [-130,-10,150,60,'#c7b8ff',10],[30,0,170,55,'#7fe0c8',10],[-60,20,120,40,'#ffffff',8]];
  items.forEach(([ix,iy,w,h,col,rad])=>{
    const g=x.createLinearGradient(ix,0,ix+w,0);g.addColorStop(0,col);g.addColorStop(.55,col);g.addColorStop(1,'#26302a');
    x.fillStyle=g;rr(ix,iy,w,h,rad);x.fill();
    x.fillStyle='rgba(0,0,0,.25)';x.fillRect(ix+6,iy+h*.42,w-12,h*.22);
    x.fillStyle='rgba(255,255,255,.45)';x.fillRect(ix+w*.18,iy+8,Math.max(4,w*.08),h-16);
    if(h>140){x.fillStyle='#dfe7e0';rr(ix+w*.3,iy-26,w*.4,30,6);x.fill()}
  });
  // basket wire
  x.strokeStyle='#cfd8d1';x.lineWidth=7;x.lineJoin='round';
  x.shadowColor='rgba(170,255,180,.6)';x.shadowBlur=14;
  x.beginPath();x.moveTo(-240,30);x.lineTo(220,30);x.lineTo(190,190);x.lineTo(-200,190);x.closePath();x.stroke();
  x.lineWidth=3.5;
  for(let i=1;i<12;i++){const t=i/12;x.beginPath();x.moveTo(-240+460*t,30);x.lineTo(-200+390*t,190);x.stroke()}
  for(let j=1;j<4;j++){const t=j/4;x.beginPath();x.moveTo(-240+40*t,30+160*t);x.lineTo(220-30*t,30+160*t);x.stroke()}
  // handle
  x.lineWidth=8;x.beginPath();x.moveTo(220,30);x.lineTo(270,-40);x.lineTo(310,-40);x.stroke();
  x.strokeStyle='#22D11E';x.lineWidth=14;x.lineCap='round';x.beginPath();x.moveTo(262,-40);x.lineTo(322,-40);x.stroke();
  // frame & wheels
  x.strokeStyle='#aeb8b0';x.lineWidth=7;x.lineCap='butt';
  x.beginPath();x.moveTo(-200,190);x.lineTo(-180,250);x.lineTo(170,250);x.lineTo(190,190);x.stroke();
  x.shadowBlur=0;
  [[-170,268],[160,268]].forEach(([wx,wy])=>{x.fillStyle='#111';x.beginPath();x.arc(wx,wy,20,0,7);x.fill();x.strokeStyle='#555';x.lineWidth=4;x.stroke();x.fillStyle='#22D11E';x.beginPath();x.arc(wx,wy,6,0,7);x.fill()});
  x.restore();
}
cart(540,420,1.0);
// price tag on handle
x.save();x.translate(800,330);x.rotate(.12);
x.shadowColor='rgba(34,209,30,.8)';x.shadowBlur=30;rr(0,0,170,86,12);x.fillStyle='#22D11E';x.fill();x.shadowBlur=0;
x.fillStyle='#050605';x.font='bold 54px Arial Black, Arial, sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('+40%',85,46);
x.strokeStyle='#cfd8d1';x.lineWidth=3;x.beginPath();x.moveTo(20,10);x.lineTo(-30,-20);x.stroke();
x.restore();
// atmosphere particles
for(let i=0;i<160;i++){x.fillStyle=`rgba(200,255,210,${r()*.25})`;const s=r()*2.2;x.fillRect(r()*W,r()*700,s,s)}
// vignette
let vg=x.createRadialGradient(540,380,200,540,420,820);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.75)');x.fillStyle=vg;x.fillRect(0,0,W,H);
// bottom fade
let bf=x.createLinearGradient(0,640,0,H);bf.addColorStop(0,'rgba(7,9,8,0)');bf.addColorStop(1,'rgba(7,9,8,1)');x.fillStyle=bf;x.fillRect(0,640,W,H-640);
// grain
const id=x.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const n=(r()-.5)*18;d[i]+=n;d[i+1]+=n;d[i+2]+=n}x.putImageData(id,0,0);
</script></body></html>
