<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1000"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=1080,H=1000;
let seed=1126;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
function rr(px,py,w,h,rad){x.beginPath();x.moveTo(px+rad,py);x.arcTo(px+w,py,px+w,py+h,rad);x.arcTo(px+w,py+h,px,py+h,rad);x.arcTo(px,py+h,px,py,rad);x.arcTo(px,py,px+w,py,rad);x.closePath()}
// background: night window over LA
let sky=x.createLinearGradient(0,0,0,700);
sky.addColorStop(0,'#04060d');sky.addColorStop(.5,'#0f1430');sky.addColorStop(.8,'#2c1c3c');sky.addColorStop(1,'#5a2f36');
x.fillStyle=sky;x.fillRect(0,0,W,H);
for(let i=0;i<150;i++){x.fillStyle=`rgba(255,255,255,${r()*.45})`;x.fillRect(r()*W,r()*300,1.3,1.3)}
let cg=x.createRadialGradient(540,690,20,540,690,700);cg.addColorStop(0,'rgba(255,140,80,.35)');cg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=cg;x.fillRect(0,0,W,H);
x.fillStyle='#171024';x.beginPath();x.moveTo(0,700);for(let i=0;i<=W;i+=20){x.lineTo(i,560-30*Math.sin(i/190)-14*Math.sin(i/61))}x.lineTo(W,700);x.fill();
function tower(px,w,h){const by=700;x.fillStyle='#0b0a14';x.fillRect(px,by-h,w,h);
 for(let yy=by-h+12;yy<by-6;yy+=14)for(let xx=px+6;xx<px+w-6;xx+=11){if(r()<.4){x.fillStyle=`rgba(255,${190+r()*50|0},${120+r()*60|0},${.2+r()*.55})`;x.fillRect(xx,yy,5,7)}}}
[[60,70,170],[150,60,120],[230,80,230],[330,60,160],[700,90,250],[810,60,180],[890,80,280],[990,70,150]].forEach(t=>tower(...t));
function palm(px,h,s){const by=700;x.strokeStyle='#040406';x.lineWidth=5*s;x.beginPath();x.moveTo(px,by);x.quadraticCurveTo(px+12*s,by-h/2,px+4*s,by-h);x.stroke();
 x.fillStyle='#040406';for(let a=0;a<9;a++){const ang=-Math.PI/2+(a-4)*0.42;x.beginPath();x.moveTo(px+4*s,by-h);
 const ex=px+4*s+Math.cos(ang)*50*s,ey=by-h+Math.sin(ang)*30*s+18*s;x.quadraticCurveTo(px+4*s+Math.cos(ang)*28*s,by-h+Math.sin(ang)*34*s,ex,ey);
 x.quadraticCurveTo(px+4*s+Math.cos(ang)*26*s,by-h+Math.sin(ang)*26*s+6*s,px+4*s,by-h);x.fill()}}
[[40,300,1.2],[120,230,.95],[1030,320,1.25],[960,240,1]].forEach(p=>palm(...p));
// window frame mullions
x.fillStyle='#0a0b0d';x.fillRect(0,0,W,18);
// string-light bokeh across top
for(let i=0;i<22;i++){const bx=i*52+r()*20,by=60+40*Math.sin(i/3.5)+r()*10,rad=10+r()*16;let g=x.createRadialGradient(bx,by,0,bx,by,rad);g.addColorStop(0,'rgba(255,205,130,.55)');g.addColorStop(1,'rgba(255,205,130,0)');x.fillStyle=g;x.beginPath();x.arc(bx,by,rad,0,7);x.fill()}
// table
let tb=x.createLinearGradient(0,690,0,H);tb.addColorStop(0,'#3a2618');tb.addColorStop(1,'#0c0805');x.fillStyle=tb;x.fillRect(0,690,W,H-690);
x.strokeStyle='rgba(0,0,0,.25)';x.lineWidth=2;for(let i=0;i<14;i++){x.beginPath();const yy=700+i*22+r()*8;x.moveTo(0,yy);x.bezierCurveTo(300,yy+r()*8,700,yy-r()*8,W,yy+r()*6);x.stroke()}
x.fillStyle='rgba(255,190,120,.12)';x.fillRect(0,690,W,3);
// pie on the left
x.save();x.translate(170,760);x.fillStyle='#1b1410';x.beginPath();x.ellipse(0,12,150,40,0,0,7);x.fill();
x.fillStyle='#8a4f22';x.beginPath();x.ellipse(0,0,135,34,0,0,7);x.fill();
x.fillStyle='#b8692a';x.beginPath();x.ellipse(0,-4,118,28,0,0,7);x.fill();
x.fillStyle='rgba(255,230,190,.25)';x.beginPath();x.ellipse(-30,-10,50,8,0,0,7);x.fill();
x.strokeStyle='#d9a066';x.lineWidth=7;x.beginPath();x.ellipse(0,-4,124,30,0,0,7);x.stroke();x.restore();
// shopping bags right
function bag(bx,by,w,h,col){x.fillStyle=col;x.beginPath();x.moveTo(bx,by);x.lineTo(bx+w,by);x.lineTo(bx+w-6,by+h);x.lineTo(bx+6,by+h);x.fill();
 x.fillStyle='rgba(255,255,255,.06)';x.fillRect(bx+w*.6,by,w*.4-6,h);x.strokeStyle='#0a0a0a';x.lineWidth=5;x.beginPath();x.arc(bx+w/2,by,w*.22,Math.PI,0);x.stroke()}
bag(830,600,130,170,'#121416');bag(920,640,120,140,'#0e2a12');x.fillStyle='rgba(34,209,30,.55)';x.beginPath();x.moveTo(850,600);x.lineTo(870,570);x.lineTo(890,600);x.fill();x.fillStyle='#f2f5f2';x.fillRect(935,700,90,4);
// phone standing, tilted
x.save();x.translate(540,500);x.rotate(-0.06);
const PW=300,PH=560;
let halo=x.createRadialGradient(0,0,60,0,0,520);halo.addColorStop(0,'rgba(34,209,30,.32)');halo.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=halo;x.fillRect(-600,-600,1200,1200);
x.fillStyle='#101214';rr(-PW/2-10,-PH/2-10,PW+20,PH+20,46);x.fill();
x.strokeStyle='rgba(255,255,255,.18)';x.lineWidth=2;rr(-PW/2-10,-PH/2-10,PW+20,PH+20,46);x.stroke();
let scr=x.createLinearGradient(0,-PH/2,0,PH/2);scr.addColorStop(0,'#0d1a10');scr.addColorStop(1,'#060c07');x.fillStyle=scr;rr(-PW/2,-PH/2,PW,PH,38);x.fill();
x.fillStyle='#000';rr(-40,-PH/2+14,80,22,11);x.fill();
// chat UI
x.fillStyle='rgba(255,255,255,.12)';rr(-PW/2+80,-PH/2+60,PW-100,52,18);x.fill();
x.fillStyle='rgba(255,255,255,.55)';x.font='600 16px Arial';x.fillText('Best gift under $100?',-PW/2+94,-PH/2+92);
// AI answer bubble
x.fillStyle='rgba(34,209,30,.16)';rr(-PW/2+18,-PH/2+130,PW-60,92,18);x.fill();
x.fillStyle='#22D11E';x.beginPath();x.arc(-PW/2+40,-PH/2+152,8,0,7);x.fill();
x.fillStyle='rgba(255,255,255,.35)';[[150],[190],[120]].forEach((l,i)=>{rr(-PW/2+58,-PH/2+146+i*20,l[0],8,4);x.fill()});
// product cards inside phone
function pcard(py,hl){x.fillStyle=hl?'rgba(34,209,30,.22)':'rgba(255,255,255,.07)';rr(-PW/2+18,py,PW-36,74,16);x.fill();
 if(hl){x.strokeStyle='#22D11E';x.lineWidth=3;rr(-PW/2+18,py,PW-36,74,16);x.stroke()}
 x.fillStyle=hl?'#22D11E':'rgba(255,255,255,.18)';rr(-PW/2+30,py+12,50,50,10);x.fill();
 x.fillStyle='rgba(255,255,255,.4)';rr(-PW/2+94,py+20,120,9,4);x.fill();rr(-PW/2+94,py+40,80,9,4);x.fill();
 x.fillStyle=hl?'#22D11E':'rgba(255,255,255,.25)';x.font='800 18px Arial';x.fillText(hl?'TOP PICK':'',-PW/2+180,py+48)}
pcard(-PH/2+244,true);pcard(-PH/2+330,false);pcard(-PH/2+416,false);
x.restore();
// floating product cards rising out of phone
function fcard(cx,cy,w,h,rot,a){x.save();x.translate(cx,cy);x.rotate(rot);x.globalAlpha=a;
 x.shadowColor='rgba(34,209,30,.6)';x.shadowBlur=30;x.fillStyle='rgba(12,26,14,.9)';rr(-w/2,-h/2,w,h,16);x.fill();x.shadowBlur=0;
 x.strokeStyle='rgba(34,209,30,.8)';x.lineWidth=2;rr(-w/2,-h/2,w,h,16);x.stroke();
 x.fillStyle='rgba(34,209,30,.5)';rr(-w/2+12,-h/2+12,h-24,h-24,10);x.fill();
 x.fillStyle='rgba(255,255,255,.45)';rr(-w/2+h,-h/2+18,w-h-18,8,4);x.fill();rr(-w/2+h,-h/2+36,(w-h)*.6,8,4);x.fill();
 x.fillStyle='#F2F5F2';for(let s=0;s<5;s++){x.beginPath();x.arc(-w/2+h+6+s*14,h/2-16,4,0,7);x.fill()}
 x.restore()}
fcard(250,300,200,80,-0.12,.9);fcard(830,250,210,84,0.1,.92);fcard(300,140,170,68,-0.05,.55);fcard(790,110,170,68,0.06,.5);
// light beams from phone to cards
x.strokeStyle='rgba(34,209,30,.25)';x.lineWidth=2;[[250,300],[830,250],[300,140],[790,110]].forEach(([tx,ty])=>{x.beginPath();x.moveTo(540,260);x.quadraticCurveTo((540+tx)/2,ty+60,tx,ty);x.stroke()});
// particles
for(let i=0;i<70;i++){const px=380+r()*320,py=80+r()*220;x.fillStyle=`rgba(92,255,77,${r()*.6})`;x.beginPath();x.arc(px,py,r()*2.4,0,7);x.fill()}
// phone reflection on table
x.save();x.translate(540,800);x.scale(1,.25);let rfl=x.createRadialGradient(0,0,0,0,0,360);rfl.addColorStop(0,'rgba(34,209,30,.3)');rfl.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=rfl;x.fillRect(-400,-400,800,800);x.restore();
// grain + vignette
const id=x.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const n=(r()-.5)*16;d[i]+=n;d[i+1]+=n;d[i+2]+=n}x.putImageData(id,0,0);
let v=x.createRadialGradient(W/2,H*0.4,300,W/2,H/2,820);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=v;x.fillRect(0,0,W,H);
</script></body></html>
